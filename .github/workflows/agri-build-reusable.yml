name: Build Agri Toolkit

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Specific commit SHA to check out"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: packages/agri-data-toolkit

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Build package
        id: build
        run: |
          echo "Building Python package..."
          poetry build
          echo "Package built successfully"

      - name: Verify build artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -la dist/
          echo ""
          echo "=== Wheel file ==="
          ls dist/*.whl || echo "No wheel file found"
          echo ""
          echo "=== Source distribution ==="
          ls dist/*.tar.gz || echo "No source distribution found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agri-toolkit-build-py${{ matrix.python-version }}
          path: packages/agri-data-toolkit/dist/
          retention-days: 7

      - name: Test package import
        run: |
          echo "Testing package import..."
          poetry run python -c "import agri_toolkit; print(f'agri_toolkit version: {agri_toolkit.__version__ if hasattr(agri_toolkit, \"__version__\") else \"version not set\"}')"
          echo "Package import successful"

      - name: Build summary
        if: always()
        run: |
          echo "## 🐍 Agri Toolkit Build (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- Wheel and source distribution created" >> $GITHUB_STEP_SUMMARY
            echo "- Package import verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
