name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  checks: write
  pull-requests: write
  deployments: write
  issues: write

jobs:
  # ============================================================================
  # PHASE 1: Environment Validation & Core CI - Run in parallel
  # ============================================================================

  validate-environment:
    name: Validate / Environment
    uses: ./.github/workflows/validate-environment-reusable.yml
    secrets: inherit

  core-ci:
    name: Validate / Core CI
    uses: ./.github/workflows/format-lint-reusable.yml
    secrets: inherit

  # ============================================================================
  # PHASE 1 GATE: Resolve commit and validate stage completion
  # ============================================================================

  validate:
    name: Validate
    needs: [validate-environment, core-ci]
    if: |
      always() &&
      needs.validate-environment.result == 'success' &&
      (needs.core-ci.result == 'success' || needs.core-ci.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      final-commit-sha: ${{ steps.resolve_commit.outputs.sha }}
      core_ci_result: ${{ steps.resolve_commit.outputs.core_ci_result }}
    steps:
      - name: Resolve commit for downstream stages
        id: resolve_commit
        run: |
          echo "sha=${{ needs.core-ci.outputs.final-commit-sha }}" >> "$GITHUB_OUTPUT"
          echo "core_ci_result=${{ needs.core-ci.result }}" >> "$GITHUB_OUTPUT"
      - name: Stage summary
        run: |
          echo "## ✅ Validate Environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- validate-environment: ${{ needs.validate-environment.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- core-ci: ${{ needs.core-ci.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- final commit sha: ${{ needs.core-ci.outputs.final-commit-sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # PHASE 2: Tests & Builds - Run in parallel after validate gate
  # ============================================================================

  test-docs-links:
    name: Test-Build / Docs Links
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/link-check-reusable.yml
    with:
      commit_sha: ${{ needs.validate.outputs.final-commit-sha }}
    secrets: inherit

  test-crewai:
    name: Test-Build / CrewAI
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/test-crewai-reusable.yml
    with:
      commit_sha: ${{ needs.validate.outputs.final-commit-sha }}
    secrets: inherit

  test-website:
    name: Test-Build / Website
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/website-test-build-reusable.yml
    with:
      commit_sha: ${{ needs.validate.outputs.final-commit-sha }}
    secrets: inherit

  test-agri-toolkit:
    name: Test-Build / Agri Toolkit
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/agri-test-reusable.yml
    with:
      commit_sha: ${{ needs.validate.outputs.final-commit-sha }}
    secrets: inherit

  build-agri-toolkit:
    name: Test-Build / Agri Toolkit Build
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/agri-build-reusable.yml
    with:
      commit_sha: ${{ needs.validate.outputs.final-commit-sha }}
    secrets: inherit

  # ============================================================================
  # PHASE 2 GATE: All tests and builds must complete
  # ============================================================================

  test-build:
    name: Test-Build
    needs: [validate, test-docs-links, test-crewai, test-website, test-agri-toolkit, build-agri-toolkit]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.test-docs-links.result == 'success' &&
      needs.test-crewai.result == 'success' &&
      needs.test-website.result == 'success' &&
      needs.test-agri-toolkit.result == 'success' &&
      needs.build-agri-toolkit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Stage summary
        run: |
          echo "## ✅ Test & Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-docs-links: ${{ needs.test-docs-links.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-crewai: ${{ needs.test-crewai.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-website: ${{ needs.test-website.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-agri-toolkit: ${{ needs.test-agri-toolkit.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- build-agri-toolkit: ${{ needs.build-agri-toolkit.result }}" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # PHASE 3: Deployments - Environment-aware deployments after test-build gate
  # ============================================================================

  deploy-preview:
    name: Deploy / Preview
    needs: [test-build]
    if: |
      github.event_name == 'pull_request' &&
      needs.test-build.result == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'Deploy: Website Preview')
    uses: ./.github/workflows/preview-deploy-reusable.yml
    with:
      workspace: website
      build_artifact: website-build
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  deploy-production:
    name: Deploy / Production
    needs: [test-build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test-build.result == 'success' &&
      contains(github.event.head_commit.message, 'Merge pull request')
    uses: ./.github/workflows/production-deploy-reusable.yml
    with:
      workspace: website
      build_artifact: website-build
    secrets: inherit

  publish-pypi:
    name: Deploy / Publish to PyPI
    needs: [test-build]
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.test-build.result == 'success'
    uses: ./.github/workflows/publish-pypi-reusable.yml
    with:
      pypi_environment: pypi
      commit_sha: ${{ github.sha }}
    secrets: inherit

  sync-template-repo:
    name: Deploy / Sync Template Repo
    needs: [test-build]
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.test-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare filtered files for template
        run: |
          echo "=== Preparing filtered files for template repository ==="
          mkdir -p /tmp/template-repo
          
          # Copy essential root files
          cp LICENSE /tmp/template-repo/ 2>/dev/null || echo "LICENSE not found"
          cp README.md /tmp/template-repo/ 2>/dev/null || echo "README.md not found"
          cp .gitignore /tmp/template-repo/ 2>/dev/null || echo ".gitignore not found"
          cp .gitattributes /tmp/template-repo/ 2>/dev/null || echo ".gitattributes not found"
          
          # Copy essential toolkit package
          if [ -d "packages/agri-data-toolkit" ]; then
            cp -r packages/agri-data-toolkit /tmp/template-repo/
            echo "✅ Copied packages/agri-data-toolkit/"
          else
            echo "❌ packages/agri-data-toolkit/ not found"
            exit 1
          fi
          
          # Copy essential scripts
          mkdir -p /tmp/template-repo/scripts
          for script in generate_sample_field_boundaries.py generate_test_map.py; do
            if [ -f "scripts/$script" ]; then
              cp "scripts/$script" /tmp/template-repo/scripts/
              echo "✅ Copied scripts/$script"
            fi
          done
          
          echo "=== Files prepared ==="
          find /tmp/template-repo -type f | sort

      - name: Update template repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Updating template repository ==="
          cd /tmp/template-repo
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Sync template repository with ${{ github.ref_name }}"
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/SuperiorByteWorks-LLC/py-agri-data-toolkit.git"
          git push -f origin main
          echo "✅ Template repository synced"

      - name: Stage summary
        if: always()
        run: |
          echo "## 📦 Template Repository Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Template repository synced successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Repository:** SuperiorByteWorks-LLC/py-agri-data-toolkit" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Template sync failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # PHASE 3 GATE: Deploy stage completion
  # ============================================================================

  deploy:
    name: Deploy
    needs: [test-build, deploy-preview, deploy-production, publish-pypi, sync-template-repo]
    if: |
      always() &&
      needs.test-build.result == 'success' &&
      (needs.deploy-preview.result == 'success' || needs.deploy-preview.result == 'skipped') &&
      (needs.deploy-production.result == 'success' || needs.deploy-production.result == 'skipped') &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') &&
      (needs.sync-template-repo.result == 'success' || needs.sync-template-repo.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Stage summary
        run: |
          echo "## ✅ Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy-preview: ${{ needs.deploy-preview.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy-production: ${{ needs.deploy-production.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish-pypi: ${{ needs.publish-pypi.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- sync-template-repo: ${{ needs.sync-template-repo.result }}" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # PHASE 4: AI Agents - Code review and analysis after all phases complete
  # ============================================================================

  crewai-review:
    name: CrewAI / Review
    needs:
      [
        validate-environment,
        core-ci,
        validate,
        test-docs-links,
        test-crewai,
        test-website,
        test-agri-toolkit,
        build-agri-toolkit,
        test-build,
        deploy-preview,
        deploy-production,
        publish-pypi,
        deploy,
      ]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    uses: ./.github/workflows/crewai-review-reusable.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      commit_sha: ${{ needs.validate.outputs.final-commit-sha || github.event.pull_request.head.sha || github.sha }}
      core_ci_result: ${{ needs.validate.outputs.core_ci_result || needs.core-ci.result || 'unknown' }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
