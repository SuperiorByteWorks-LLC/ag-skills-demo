name: Create Template Repository

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Name of the template repository to create"
        required: false
        default: "py-agri-data-toolkit"
        type: string
      dry_run:
        description: "Dry run mode - don't actually create the repository"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-template:
    name: Create Minimal Template Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare filtered files
        run: |
          echo "=== Preparing filtered files for template repository ==="

          # Create staging directory
          mkdir -p /tmp/template-repo

          # Copy essential root files
          cp LICENSE /tmp/template-repo/ 2>/dev/null || echo "LICENSE not found"
          cp README.md /tmp/template-repo/ 2>/dev/null || echo "README.md not found"
          cp .gitignore /tmp/template-repo/ 2>/dev/null || echo ".gitignore not found"
          cp .gitattributes /tmp/template-repo/ 2>/dev/null || echo ".gitattributes not found"

          # Copy essential toolkit package
          if [ -d "packages/agri-data-toolkit" ]; then
            cp -r packages/agri-data-toolkit /tmp/template-repo/
            echo "✅ Copied packages/agri-data-toolkit/"
          else
            echo "❌ packages/agri-data-toolkit/ not found"
            exit 1
          fi

          # Copy essential scripts
          mkdir -p /tmp/template-repo/scripts
          for script in generate_sample_field_boundaries.py generate_test_map.py; do
            if [ -f "scripts/$script" ]; then
              cp "scripts/$script" /tmp/template-repo/scripts/
              echo "✅ Copied scripts/$script"
            fi
          done

          echo "=== Files prepared in /tmp/template-repo ==="
          find /tmp/template-repo -type f | sort

      - name: Verify exclusions
        run: |
          echo "=== Verifying course materials are excluded ==="

          # Check for excluded patterns
          EXCLUSIONS=(
            "docs/"
            "slides/"
            "apps/"
            "website/"
            ".crewai/"
            "class-*.pdf"
            "class-*.tex"
          )

          FOUND_EXCLUDED=false

          for pattern in "${EXCLUSIONS[@]}"; do
            if find /tmp/template-repo -name "$pattern" -o -path "*/$pattern*" 2>/dev/null | grep -q .; then
              echo "❌ Found excluded pattern: $pattern"
              FOUND_EXCLUDED=true
            fi
          done

          # Specifically check for docs/classes/, docs/agentic/, docs/project/
          if find /tmp/template-repo -path "*/docs/classes/*" -o -path "*/docs/agentic/*" -o -path "*/docs/project/*" 2>/dev/null | grep -q .; then
            echo "❌ Found class/agentic/project docs"
            FOUND_EXCLUDED=true
          fi

          if [ "$FOUND_EXCLUDED" = true ]; then
            echo "❌ FAILED: Course materials detected in template"
            exit 1
          fi

          echo "✅ All course materials successfully excluded"

      - name: Create or update template repository
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SOURCE_OWNER: ${{ github.repository_owner }}
        run: |
          echo "=== Creating/updating template repository: $SOURCE_OWNER/$TARGET_REPO ==="

          # Check if repository exists
          REPO_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$SOURCE_OWNER/$TARGET_REPO")

          if [ "$REPO_EXISTS" == "200" ]; then
            echo "Repository exists. Updating contents..."
            # Repository exists - we'll update it via git push
            cd /tmp/template-repo
            git init
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Update template repository"
            git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/$SOURCE_OWNER/$TARGET_REPO.git"
            git push -f origin main
            echo "✅ Repository updated"
          else
            echo "Creating new repository..."
            # Create repository via API
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/repos" \
              -d "{
                \"name\": \"$TARGET_REPO\",
                \"description\": \"Minimal template for agri-data-toolkit Python package\",
                \"private\": false,
                \"is_template\": true,
                \"auto_init\": false
              }"

            # Push contents
            cd /tmp/template-repo
            git init
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Initial template repository"
            git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/$SOURCE_OWNER/$TARGET_REPO.git"
            git push -u origin main
            echo "✅ Repository created and set as template"
          fi

      - name: Set repository as template (if existing)
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SOURCE_OWNER: ${{ github.repository_owner }}
        run: |
          echo "=== Ensuring repository is set as template ==="
          curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$SOURCE_OWNER/$TARGET_REPO" \
            -d '{"is_template": true}'
          echo "✅ Repository configured as template"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## 🧪 Template Repository - Dry Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files that would be included:" >> $GITHUB_STEP_SUMMARY
          find /tmp/template-repo -type f | sort | while read file; do
            echo "- \`${file#/tmp/template-repo/}\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dry run complete - no repository created" >> $GITHUB_STEP_SUMMARY

      - name: Success summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## ✅ Template Repository Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`SuperiorByteWorks-LLC/${{ inputs.target_repo }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Template URL:** https://github.com/SuperiorByteWorks-LLC/${{ inputs.target_repo }}/generate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Included Files" >> $GITHUB_STEP_SUMMARY
          find /tmp/template-repo -type f | sort | while read file; do
            echo "- \`${file#/tmp/template-repo/}\`" >> $GITHUB_STEP_SUMMARY
          done
