[project]
name = "landsat-imagery"
version = "1.0.0"
description = "Landsat satellite imagery downloader"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rasterio>=1.3.0",
    "requests>=2.28.0",
    "shapely>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
