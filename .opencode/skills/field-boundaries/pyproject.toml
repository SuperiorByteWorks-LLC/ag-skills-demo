[project]
name = "field-boundaries"
version = "1.0.0"
description = "USDA NASS Crop Sequence Boundaries downloader"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "matplotlib>=3.7.0",
    "shapely>=2.0.0",
    "pyarrow>=12.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
