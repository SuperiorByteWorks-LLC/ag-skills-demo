[project]
name = "interactive-web-map"
version = "1.0.0"
description = "Interactive web map generator for agricultural data"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "pandas>=2.0.0",
    "folium>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
