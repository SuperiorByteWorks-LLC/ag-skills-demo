[project]
name = "cdl-cropland"
version = "1.0.0"
description = "USDA Cropland Data Layer downloader"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rasterio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
